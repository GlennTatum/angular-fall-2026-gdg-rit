<div>
    <h3>Iteration Constructs</h3>
</div>

<div>
    <ul>
    @for(fruit of fruits; track fruit.id) {
        <li>{{ fruit.name }}</li>
    }
    </ul>
</div>

<div>
    <h3>If/else logic</h3>

    @if(1 + 1 === 2) {
        <p>1 + 1 does equal 2</p>
    } @else {
        <p>1 + 1 does not equal 2?</p>
    }
</div>
